# Free Supabase projects pause after 7 days without activity, which would
# break sign-in, scores, votes and leaderboards. This reads the public
# leaderboard once a day so the project always counts as active.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       e.g. https://bfpkatamgtmwwskhelrm.supabase.co
#   SUPABASE_ANON_KEY  the publishable key (sb_publishable_…), same as in .env
#
# Note: GitHub turns off scheduled workflows in public repos after 60 days
# with no commits. It emails you first; re-enable it under the Actions tab.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch: # allows a manual "Run workflow" button

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the public leaderboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Tolerate stray spaces, line breaks or a trailing slash pasted into the secrets.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's:/*$::')
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          case "$url" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL should look like https://xxxx.supabase.co (it has ${#url} characters and starts with '${url:0:8}')."; exit 1 ;;
          esac
          echo "Pinging $url (key: ${#key} characters, starts with ${key:0:15})"
          set +e
          status=$(curl -sS -o response.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$url/rest/v1/leaderboard?select=score&limit=1" \
            -H "apikey: $key" \
            -H "Authorization: Bearer $key")
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "::error::Could not reach Supabase (curl error $code). Check SUPABASE_URL."
            exit 1
          fi
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.json
            echo "::error::Supabase did not answer normally. If it says the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi
          echo "Supabase is awake."
