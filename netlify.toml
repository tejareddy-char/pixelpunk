[build]
  command = "npm run build"
  publish = "dist"
  # Skip the rebuild (and save free-plan credits) when a push only changes
  # files that aren't part of the website. Exit 0 = skip, anything else = build.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)supabase' ':(exclude)README.md'"

[build.environment]
  NODE_VERSION = "24"
